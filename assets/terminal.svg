<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0B111E"/>
      <stop offset="100%" stop-color="#0D1527"/>
    </linearGradient>

    <!-- Header Gradient -->
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Scanline Gradient -->
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .mono {
        font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Monaco, Consolas, monospace;
      }
      
      /* Global Animation Loop: 20 Seconds */
      .state-1 { animation: s1 20s infinite ease-in-out; }
      .state-2 { animation: s2 20s infinite ease-in-out; }
      .state-3 { animation: s3 20s infinite ease-in-out; }
      .state-4 { animation: s4 20s infinite ease-in-out; }
      .state-5 { animation: s5 20s infinite ease-in-out; }

      @keyframes s1 {
        0% { opacity: 0; transform: translateY(6px); }
        2%, 17% { opacity: 1; transform: translateY(0); }
        19%, 100% { opacity: 0; transform: translateY(-6px); }
      }
      @keyframes s2 {
        0%, 19% { opacity: 0; transform: translateY(6px); }
        21%, 37% { opacity: 1; transform: translateY(0); }
        39%, 100% { opacity: 0; transform: translateY(-6px); }
      }
      @keyframes s3 {
        0%, 39% { opacity: 0; transform: translateY(6px); }
        41%, 57% { opacity: 1; transform: translateY(0); }
        59%, 100% { opacity: 0; transform: translateY(-6px); }
      }
      @keyframes s4 {
        0%, 59% { opacity: 0; transform: translateY(6px); }
        61%, 77% { opacity: 1; transform: translateY(0); }
        79%, 100% { opacity: 0; transform: translateY(-6px); }
      }
      @keyframes s5 {
        0%, 79% { opacity: 0; transform: translateY(6px); }
        81%, 97% { opacity: 1; transform: translateY(0); }
        99%, 100% { opacity: 0; transform: translateY(-6px); }
      }

      /* Scanline motion */
      .scanline {
        animation: scan 4s linear infinite;
      }
      @keyframes scan {
        0% { transform: translateY(45px); opacity: 0; }
        15% { opacity: 0.4; }
        85% { opacity: 0.4; }
        100% { transform: translateY(430px); opacity: 0; }
      }

      /* Cursor blink */
      .cursor {
        animation: blink 0.8s infinite;
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      /* Pulse elements */
      .pulse {
        animation: pulse 1.8s infinite ease-in-out;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
    </style>
  </defs>

  <!-- Terminal Window Frame -->
  <rect x="5" y="5" width="840" height="430" rx="10" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Title Bar -->
  <rect x="5" y="5" width="840" height="38" rx="10" fill="url(#headerGrad)"/>
  <line x1="5" y1="43" x2="845" y2="43" stroke="#334155" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="28" cy="24" r="5.5" fill="#EF4444"/>
  <circle cx="46" cy="24" r="5.5" fill="#F59E0B"/>
  <circle cx="64" cy="24" r="5.5" fill="#10B981"/>

  <!-- Window Header Title -->
