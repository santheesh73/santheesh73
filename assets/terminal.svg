      <text x="250" y="30" fill="#64748B" font-size="11" class="mono">| Memory: 64MB · Engine: v2.4.0 · Precision: FP16</text>
      <text x="765" y="30" text-anchor="end" fill="#10B981" font-size="11" class="mono" font-weight="bold">[READY]</text>
