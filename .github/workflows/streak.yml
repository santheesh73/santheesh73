name: Generate Streak Stats

on:
  schedule:
    # Run every hour
    - cron: "0 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "assets/streak.svg"

jobs:
  update-streak:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate and synchronize streak stats
        env:
          STREAK_STATS_TOKEN: ${{ secrets.STREAK_STATS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/update_streak.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/streak.svg
          git diff --cached --quiet || (git commit -m "chore: update streak stats [skip ci]" && git push)
