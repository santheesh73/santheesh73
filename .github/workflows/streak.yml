name: Generate Streak Stats

on:
  schedule:
    # Run once every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "assets/streak.svg"

jobs:
  update-streak:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate streak stats SVG
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          username: ${{ github.repository_owner }}
          path: assets/streak.svg
          token: ${{ secrets.STREAK_STATS_TOKEN || secrets.GITHUB_TOKEN }}
          options: theme=tokyonight&hide_border=true&timezone=Asia/Kolkata

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/streak.svg
          git diff --cached --quiet || git commit -m "chore: update streak stats [skip ci]"
          git push
